# API-BUCKET-S3 - Configuração de Produção para Nuvem
# Este perfil deve ser usado em ambientes de produção (EC2, ECS, etc.)
# Todas as variáveis sensíveis DEVEM ser fornecidas via variáveis de ambiente

spring.application.name=BucketS3
server.port=${SERVER_PORT:8081}

# AWS Credentials - OBRIGATÓRIAS via variáveis de ambiente em produção
# NUNCA hardcode credenciais AWS aqui!
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.sessionToken=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:softwave-arquivos-prod}

# Tamanho máximo do arquivo
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# CORS - Configurar para domínio de produção
spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.mvc.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,DELETE}
spring.mvc.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging para produção - CloudWatch
logging.level.root=INFO
logging.level.com.project.softwave=INFO
logging.level.org.springframework=WARN
logging.file.name=/var/log/softwave/bucket-s3.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

