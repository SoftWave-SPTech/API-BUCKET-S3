spring.application.name=BucketS3
server.port=${SERVER_PORT:8081}

# AWS Credentials - Use variáveis de ambiente (obrigatórias em produção)
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.sessionToken=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:softwave-arquivos-prod}

# Tamanho máximo do arquivo
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.mvc.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,DELETE}
spring.mvc.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
