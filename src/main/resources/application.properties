spring.application.name=BucketS3
server.port=8081
aws.accessKey=$AWS_ACCESS_KEY_ID
aws.secretKey=$AWS_SECRET_ACCESS_KEY
aws.sessionToken=$AWS_SESSION_TOKEN
# Tamanho maximo do arquivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,DELETE
spring.mvc.cors.allowed-headers=*

aws.region=us-east-1
aws.s3.bucket=softwave-arquivos-prod
