spring.application.name=BucketS3
server.port=8081
aws.accessKey=$AWS_ACCESS_KEY_ID
aws.secretKey=$AWS_SECRET_ACCESS_KEY
aws.sessionToken=$AWS_SESSION_TOKEN
# Tamanho maximo do arquivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS será configurado via classe CorsConfig usando variável de ambiente CORS_ALLOWED_ORIGINS
# Para desenvolvimento local, use: http://localhost:5173,http://localhost:3000,http://localhost:8080

aws.region=us-east-1
aws.s3.bucket=softwave-arquivos-prod
